<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pré-diagnostic — Domotique à Distance</title><link rel="stylesheet" href="styles.css">
</head>
<body class="form-page">
<main class="form-shell">
<a class="back" href="index.html">← Retour au site</a>
<section class="form-card">
<div class="eyebrow">Pré-diagnostic gratuit</div>
<h1>Décrivez votre besoin.</h1>
<p class="intro">Cette étape permet de vérifier votre demande avant toute prestation payante.</p>
<form id="diagnosticForm">
<div class="grid2">
<div class="field"><label for="prenom">Prénom</label><input id="prenom" name="prenom" required></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
</div>
<div class="field"><label for="offre">Offre envisagée</label><select id="offre" name="offre"><option>Je ne sais pas encore</option><option>Diagnostic — 39 €</option><option>Intervention — 99 €</option><option>Optimisation — 149 €</option></select></div>
<div class="field"><label for="theme">Sujet principal</label><select id="theme" name="theme" required><option value="">Choisir…</option><option>Automatisations</option><option>Zigbee / Matter</option><option>Dashboard</option><option>Google Home</option><option>Chauffage</option><option>Volets / présence</option><option>Énergie</option><option>Notifications</option><option>Autre</option></select></div>
<div class="field"><label for="version">Version Home Assistant</label><input id="version" name="version" placeholder="Facultatif"></div>
<div class="field"><label for="probleme">Que se passe-t-il aujourd'hui ?</label><textarea id="probleme" name="probleme" required></textarea></div>
<div class="field"><label for="objectif">Quel résultat souhaitez-vous ?</label><textarea id="objectif" name="objectif" required></textarea></div>
<div class="field"><label for="materiel">Matériel / intégrations concernés</label><textarea id="materiel" name="materiel" placeholder="Sonoff, Zigbee2MQTT, Somfy, Google Home…"></textarea></div>
<div class="field"><label for="acces">Accès distant possible ?</label><select id="acces" name="acces"><option>Je ne sais pas</option><option>Oui</option><option>Non</option></select></div>
<div class="field"><label for="disponibilite">Disponibilités</label><input id="disponibilite" name="disponibilite" placeholder="Ex. semaine après 19 h"></div>
<div class="field"><label><input id="scope" type="checkbox" required style="width:auto;margin-right:8px">Je comprends que le service porte sur la configuration logicielle à distance, sans travail électrique ni câblage.</label></div>
<div class="actions"><button class="btn" type="submit">Préparer ma demande</button><button class="btn ghost" id="copyBtn" type="button">Copier le résumé</button></div>
<div class="notice">Version de lancement : aucune donnée n'est encore envoyée. Le formulaire de réception gratuit sera branché avant l'ouverture commerciale.</div>
<div class="success" id="successBox"></div>
</form>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
